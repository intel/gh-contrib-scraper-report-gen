name: "Dependency review"

# Blocks pull requests that add or update a dependency (pip requirements, GitHub Actions) with a known vulnerability.
# No path filter: the job is a required check on main, and a filtered workflow would leave PRs waiting for it.
on:
  pull_request:
    branches: [ "main" ]

permissions: {}  # no default token permissions; the job below requests only what it needs

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # reads the dependency graph diff between base and head; no checkout needed
    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      with:
        fail-on-severity: moderate
        # The summary goes to the job summary only. Posting it as a PR comment needs pull-requests: write,
        # which fork PRs do not get anyway.
        comment-summary-in-pr: never
        show-patched-versions: true
